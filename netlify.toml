[build]
  publish = "."

# ── Domain consolidation ─────────────────────────────────────
# evenground.org is the ONE canonical domain. The secondary domains
# (evenground.net, and the legacy thembanathi.org) 301 here, paths
# preserved, so old inbound links keep working and search engines
# never index duplicate content across three hosts. These rules are
# host-conditional: they only fire for requests arriving on those
# domains, so they're dormant until each domain's DNS points at
# this site. They MUST sit above the catch-all (first match wins).
#
# NOTE: deliberately NO redirect for even-ground.netlify.app
# yet — until evenground.org DNS is live, that's the only working
# address; redirecting it would take the site down. Add it after
# cutover as the final de-staging step.
[[redirects]]
  from = "https://evenground.net/*"
  to = "https://evenground.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.evenground.net/*"
  to = "https://evenground.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://thembanathi.org/*"
  to = "https://evenground.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.thembanathi.org/*"
  to = "https://evenground.org/:splat"
  status = 301
  force = true

# ── De-staging (enabled 2026-07-03, after SSL went live) ─────
# The staging address 301s to the real domain so search engines and
# bookmarks consolidate on evenground.org.
[[redirects]]
  from = "https://even-ground.netlify.app/*"
  to = "https://evenground.org/:splat"
  status = 301
  force = true

# ── Working docs are not part of the website ─────────────────
# publish = "." means EVERY tracked file ships, including the markdown we keep
# for ourselves. Until 2026-07-30 these were live and crawlable at
# evenground.org: the runbook (registrar, DNS records, GA4 id, do-not-touch
# list), the content scrape records, and the planning notes. Nothing secret,
# but none of it is for visitors or search engines, and one line in
# content/even-ground.md speculated about a named partner's future.
#
# Netlify already refuses dotfiles and netlify.toml itself. These rules cover
# the rest. 404 (not 301) because the correct answer is "no such page".
#
# If you add another working doc at the root, add it here too — or better, keep
# working docs in a folder that already has a rule.
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/plans/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/HANDOVER.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# ── Clean-URL shortcuts ──────────────────────────────────────
# Friendly addresses for print materials, emails, and old links.
[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 301

[[redirects]]
  from = "/give"
  to = "/donate.html"
  status = 301

[[redirects]]
  from = "/stories"
  to = "/impact-stories.html"
  status = 301

[[redirects]]
  from = "/impact"
  to = "/impact-stories.html"
  status = 301

# NOTE: the old SPA-style catch-all (/* -> /index.html 200) was removed on
# purpose. This is a multi-page site with explicit .html links; the catch-all
# made every bad URL serve the homepage as a "soft 404". Without it, Netlify
# automatically serves 404.html (with a real 404 status) for unknown paths.

# Production caching strategy:
# - HTML: always revalidate (5 min cache for stale-while-revalidate benefit)
# - CSS / JS: long cache (query-string ?v=N cache buster invalidates on change)
# - Images: medium cache (1 week — filenames are stable; bump filename to invalidate)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
